name: CashMemer

options:
  bundleIdPrefix: com.cashmemer
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.7"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 7.0.0
  # Firebase 10.29 is the last line that still builds under Xcode 14; 11.x
  # requires Xcode 15.2. Raise this only after moving off Xcode 14.2.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 10.29.0

fileGroups:
  - README.md
  - project.yml

targets:
  # ---------------------------------------------------------------- iOS / iPadOS
  CashMemer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CashMemer
        excludes:
          - "Resources/Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cashmemer.app
        INFOPLIST_FILE: CashMemer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CashMemer/Resources/CashMemer.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        SUPPORTS_MAC_CATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    dependencies:
      - sdk: CoreData.framework
      - sdk: CoreSpotlight.framework
      - sdk: AppIntents.framework
      - sdk: PencilKit.framework
      - sdk: PDFKit.framework
      - sdk: VisionKit.framework
      - sdk: Charts.framework
      - sdk: WeatherKit.framework
        weak: true
      - sdk: ActivityKit.framework
        weak: true
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - target: CashMemerWidgets
      - target: CashMemerWatch

  # ---------------------------------------------------------------- Widgets + Live Activity
  CashMemerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CashMemerWidgets
        excludes:
          - "Info.plist"
      # The extension needs the store, the theme and the activity attributes,
      # but not the app's view layer.
      - path: Shared/Models
      - path: Shared/Currency
      - path: Shared/Localization
      - path: Shared/Theme
      - path: Shared/Persistence
      - path: Shared/LiveActivity
      - path: Shared/Receipt/ReceiptTotals.swift
      - path: Shared/Spotlight
      - path: CashMemer/Features/Dashboard/DashboardMetrics.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cashmemer.app.widgets
        INFOPLIST_FILE: CashMemerWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: CashMemerWidgets/CashMemerWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: CoreData.framework
      - sdk: ActivityKit.framework
        weak: true

  # ---------------------------------------------------------------- watchOS
  CashMemerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: CashMemerWatch
        excludes:
          - "Info.plist"
      # Deliberately narrow: the watch shows History and Dashboard from a synced
      # payload, so it never links Core Data, PDFKit or the scanner.
      - path: Shared/Models/Enums.swift
      - path: Shared/Models/AppSettings.swift
      - path: Shared/Currency/Currency.swift
      - path: Shared/Localization
      - path: Shared/Theme/Theme.swift
      - path: Shared/Sync/WatchPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cashmemer.app.watchkitapp
        INFOPLIST_FILE: CashMemerWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: CashMemerWatch/CashMemerWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
    dependencies:
      - sdk: WatchConnectivity.framework
      - sdk: SwiftUI.framework

schemes:
  CashMemer:
    build:
      targets:
        CashMemer: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release

  CashMemerWatch:
    build:
      targets:
        CashMemerWatch: all
    run:
      config: Debug
